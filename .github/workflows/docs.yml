name: Documentation

on:
  push:
    branches:
      - master
    tags: [v*]
  pull_request:

permissions:
  contents: write # Required to push the built docs to the gh-pages branch
  statuses: write # Required so Documenter can report the deployment status

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHON: ""
      DATADEPS_ALWAYS_ACCEPT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - name: Install dependencies
        # WeightNormalizedRBMs is picked up through the [workspace] in Project.toml
        run: julia --project=docs/ -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          # Deploy via the Actions token. The repository's DOCUMENTER_KEY SSH deploy
          # key is no longer valid (deploys failed with "Permission denied (publickey)"),
          # so it is intentionally not passed here: Documenter prefers DOCUMENTER_KEY
          # over GITHUB_TOKEN whenever it is set.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
